<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Contact - w1ng00</title>
    <link href="https://fonts.googleapis.com/css2?family=Nosifer&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            background: linear-gradient(135deg, #000000, #1a1a1a, #000000);
            color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            line-height: 1.6;
        }

        /* Stars Background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration, 3s) infinite ease-in-out;
            opacity: var(--opacity, 0.7);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Main Content */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Back to Home Link */
        .back-home {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #c0c0c0;
            text-decoration: none;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .back-home:hover, .back-home:focus {
            color: white;
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        /* Contact Section */
        .contact-section {
            text-align: center;
            max-width: 800px;
            padding: 40px 20px;
            background: rgba(20, 20, 20, 0.7);
            border-radius: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .contact-section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
            z-index: -1;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .section-title {
            font-size: clamp(2rem, 6vw, 3rem);
            margin-bottom: 30px;
            text-align: center;
            background: linear-gradient(45deg, #ffffff, #f0f0f0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
            font-family: 'Nosifer', cursive;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ffffff, transparent);
        }

        .contact-info {
            margin: 30px 0;
            line-height: 2;
            font-size: clamp(1rem, 3vw, 1.2rem);
        }

        .contact-info p {
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .contact-info span {
            font-weight: 600;
            color: #ffffff;
        }

        /* Contact Buttons */
        .contact-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 40px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .contact-btn {
            padding: 16px 24px;
            border: none;
            border-radius: 25px;
            font-size: clamp(1rem, 3vw, 1.1rem);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .contact-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                rgba(255, 255, 255, 0.1) 0%,
                rgba(255, 255, 255, 0.2) 50%,
                rgba(255, 255, 255, 0.1) 100%);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
            z-index: -1;
        }

        .contact-btn:hover::before, .contact-btn:focus::before {
            transform: translateX(100%);
        }

        .email-btn {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: white;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
        }

        .whatsapp-btn {
            background: linear-gradient(135deg, #0d6e3a, #10b981);
            color: white;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
        }

        .contact-btn:hover, .contact-btn:focus {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
            outline: none;
        }

        .contact-btn:active {
            transform: translateY(0) scale(1);
        }

        /* Icons */
        .icon {
            font-size: clamp(1.2rem, 3.5vw, 1.5rem);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .contact-buttons {
                gap: 15px;
            }
            
            .contact-btn {
                padding: 14px 20px;
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .section-title {
                font-size: 2rem;
            }
            
            .contact-info {
                font-size: 0.95rem;
            }
            
            .contact-btn {
                padding: 12px 16px;
                font-size: 0.95rem;
            }
            
            .icon {
                font-size: 1.2rem;
            }
        }

        /* Touch device optimizations */
        @media (hover: none) and (pointer: coarse) {
            .contact-btn:hover {
                transform: none;
                box-shadow: none;
            }
            
            .contact-btn:active {
                transform: translateY(-3px);
                box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
            }
        }
    </style>
</head>
<body>
    <!-- Stars Background -->
    <div class="stars" id="stars"></div>
    
    <!-- Back to Home -->
    <a href="index.html" class="back-home" aria-label="Back to Home">← Back</a>

    <!-- Main Content -->
    <div class="container">
        <div class="contact-section">
            <h2 class="section-title">Get In Touch</h2>
            
            <div class="contact-info">
                <p>
                    <span>📧 Email:</span>
                    <a href="mailto:winggbusiness@gmail.com" style="color: #3b82f6; text-decoration: none;">winggbusiness@gmail.com</a>
                </p>
                <p>
                    <span>📱 WhatsApp:</span>
                    <a href="https://wa.me/6588512338" target="_blank" style="color: #10b981; text-decoration: none;">+65 8851 2338</a>
                </p>
            </div>

            <div class="contact-buttons">
                <a href="mailto:winggbusiness@gmail.com" class="contact-btn email-btn" target="_blank">
                    <span class="icon">📧</span>
                    Send Email
                </a>
                <a href="https://wa.me/6588512338" class="contact-btn whatsapp-btn" target="_blank">
                    <span class="icon">💬</span>
                    Chat on WhatsApp
                </a>
            </div>
        </div>
    </div>

    <script>
        // Create sparkling stars
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = window.innerWidth < 768 ? 60 : 100;
            
            starsContainer.innerHTML = '';
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                // Random properties
                const size = Math.random() * 2 + 1;
                const posX = Math.random() * 100;
                const posY = Math.random() * 100;
                const duration = Math.random() * 4 + 2;
                const opacity = Math.random() * 0.6 + 0.4;
                const delay = Math.random() * 3;
                
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${posX}%`;
                star.style.top = `${posY}%`;
                star.style.setProperty('--duration', `${duration}s`);
                star.style.setProperty('--opacity', opacity);
                star.style.animationDelay = `${delay}s`;
                
                starsContainer.appendChild(star);
            }
        }

        // Initialize stars on page load
        document.addEventListener('DOMContentLoaded', () => {
            createStars();
        });

        // Handle resize events
        window.addEventListener('resize', () => {
            createStars();
        });
        
        // Prevent zoom on mobile double-tap
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
